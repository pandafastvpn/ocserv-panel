<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ocserv-panel - 面板设置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100vh;background:#1e293b;border-right:1px solid #334155;padding:20px 0;overflow-y:auto}
.sidebar h1{font-size:18px;text-align:center;margin-bottom:30px;color:#38bdf8}
.sidebar a{display:block;padding:12px 24px;color:#94a3b8;text-decoration:none;transition:all .2s}
.sidebar a:hover{background:#334155;color:#e2e8f0}
.sidebar a.active{background:#0ea5e9;color:#fff}
.main{margin-left:240px;padding:30px;min-height:100vh}
.card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:24px;margin-bottom:20px}
.card h2{font-size:18px;margin-bottom:16px;color:#38bdf8}
.btn{display:inline-block;padding:8px 20px;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.btn-primary{background:#0ea5e9;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
form label{display:block;margin-bottom:6px;font-size:14px;color:#94a3b8}
form input{width:100%;padding:8px 12px;background:#0f172a;border:1px solid #334155;border-radius:6px;color:#e2e8f0;font-size:14px;margin-bottom:16px}
.alert{padding:12px 16px;border-radius:6px;margin-bottom:16px}
.alert-success{background:#14532d;border:1px solid #16a34a}
</style>
</head>
<body>
<div class="sidebar">
<h1>ocserv-panel</h1>
<a href="/">控制台</a>
<a href="/sessions">在线会话</a>
<a href="/groups">用户组管理</a>
<a href="/ocserv">Ocserv 设置</a>
<a href="/radius">RADIUS 设置</a>
<a href="/certs">证书管理</a>
<a href="/monitor">节点监控</a>
<a href="/settings" class="active">面板设置</a>
<a href="/logout">退出登录</a>
</div>
<div class="main">
<h2 style="margin-bottom:20px;color:#38bdf8;">面板设置</h2>
{{if .Saved}}
<div class="alert alert-success">设置已保存，面板将自动重启...</div>
{{end}}
<div class="card">
<h2>修改管理员账号</h2>
<form action="/settings/save" method="POST">
<label>用户名</label>
<input type="text" name="username" value="{{.User}}" required>
<label>新密码</label>
<input type="password" name="password" value="{{.Pass}}" required>
<label>面板端口</label>
<input type="number" name="port" value="{{.Port}}" min="1" max="65535" required>
<button type="submit" class="btn btn-primary">保存设置</button>
</form>
</div>
<div class="card">
<h2>注意</h2>
<p style="color:#94a3b8;font-size:14px;line-height:1.8;">
- 修改端口后面板会自动重启，请用新端口访问<br>
- 修改密码后需要重新登录<br>
- 如果改了端口忘记了，可以通过 SSH 执行：<code>cat /opt/ocserv-panel/data/config.json</code> 查看
</p>
</div>
</div>
</body>
</html>
